<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SafeShare AI Shield</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #f8fafc;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 12px;
    }
    .logo-icon {
      font-size: 24px;
    }
    .title-group h1 {
      font-size: 15px;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: -0.2px;
    }
    .title-group p {
      font-size: 11px;
      color: #94a3b8;
    }
    .status-card {
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #10b981;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
    }
    .model-tag {
      font-size: 10px;
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      color: #cbd5e1;
    }
    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .stat-box {
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 8px 10px;
      text-align: center;
    }
    .stat-num {
      font-size: 18px;
      font-weight: 700;
      color: #38bdf8;
    }
    .stat-label {
      font-size: 10px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .test-box {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .test-box label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    .test-input {
      width: 100%;
      background: #090d16;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      color: #f1f5f9;
      padding: 6px 8px;
      font-size: 11px;
      resize: none;
      font-family: inherit;
      outline: none;
      margin-bottom: 6px;
    }
    .test-input:focus {
      border-color: #10b981;
    }
    .btn {
      width: 100%;
      padding: 7px;
      background: #10b981;
      color: #042f2e;
      border: none;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #34d399;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-top: 6px;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
    }
    .test-output {
      margin-top: 8px;
      font-size: 11px;
      background: #090d16;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px dashed rgba(16, 185, 129, 0.4);
      color: #a7f3d0;
      display: none;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-icon">🛡️</div>
    <div class="title-group">
      <h1>SafeShare AI Shield</h1>
      <p>Zero-Trust Autonomous Privacy Firewall</p>
    </div>
  </div>

  <div class="status-card">
    <div class="status-indicator">
      <div class="pulse-dot" id="status-dot"></div>
      <span id="status-text">Connecting...</span>
    </div>
    <span class="model-tag" id="model-tag">Gemma 4</span>
  </div>

  <div class="stats-row">
    <div class="stat-box">
      <div class="stat-num" id="stat-threats">0</div>
      <div class="stat-label">Threats Blocked</div>
    </div>
    <div class="stat-box">
      <div class="stat-num" id="stat-scans">0</div>
      <div class="stat-label">Prompts Scanned</div>
    </div>
  </div>

  <div class="test-box">
    <label>⚡ Quick Interception Simulator</label>
    <textarea class="test-input" id="test-input" rows="2" placeholder="e.g. adhar 4532 8901 2345, passwrd Lic@2026"></textarea>
    <button class="btn" id="btn-test">Simulate Interception</button>
    <div class="test-output" id="test-output"></div>
  </div>

  <button class="btn btn-secondary" id="btn-dashboard">Open SafeShare App ↗</button>

  <script src="popup.js"></script>
</body>
</html>
